[licenses]
# Keep the list minimal: each entry should be a license actually
# encountered in the dependency graph, or a permissive license a
# transitive update is plausibly going to introduce. The four
# obscure entries (CDLA-Permissive-2.0, NCSA, BSL-1.0,
# Unicode-DFS-2016) that lived here historically were dropped
# during the 2026-05-02 audit — never seen in our graph and easy
# enough to re-add through an explicit license review when
# something legitimate brings them in.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
unused-allowed-license = "warn"

[bans]
multiple-versions    = "warn"
wildcards            = "deny"
allow-wildcard-paths = true

[advisories]
# Add ignores here only with a comment explaining why.

[sources]
unknown-registry = "deny"
unknown-git      = "deny"
allow-registry   = ["https://github.com/rust-lang/crates.io-index"]
