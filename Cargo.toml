[package]
name         = "formawasm"
description  = "Backend that compiles a typed IR into a WebAssembly component."
version      = "0.1.0"
edition      = "2024"
rust-version = "1.93"
authors      = ["Valentin Radu and formawasm contributors"]
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/valentinradu/formawasm"
readme       = "README.md"
keywords     = ["compiler", "webassembly", "wasm", "component-model"]
categories   = ["compilers", "wasm"]
publish      = false

[dependencies]
# Path dependency during dev — flips to a version constraint once the
# upstream IR shape stabilises on crates.io.
formalang = { path = "../formalang" }
thiserror = "2"

# WebAssembly emission stack. wasm-encoder builds core module bytes;
# wit-component wraps a core module + WIT into a Component Model
# artifact; wit-parser is the WIT-text frontend `wit-component` builds
# its `Resolve` on. wasm-tools crates share a coordinated version line.
wasm-encoder  = "0.247"
wit-component = "0.247"
wit-parser    = "0.247"

[dev-dependencies]
# wasmparser validates emitted core modules in tests; wasmtime hosts
# the component for end-to-end smoke tests.
wasmparser = "0.247"
wasmtime   = "44"

# ---------------------------------------------------------------------------
# Lint configuration. Strict by default; every override carries a comment
# explaining the reason. Enforced in CI.
# ---------------------------------------------------------------------------

[lints.rust]
unreachable_pub               = "deny"
unsafe_code                   = "forbid"
unused_must_use               = "deny"
missing_debug_implementations = "warn"
dead_code                     = "warn"

[lints.clippy]
# Lint groups (individual overrides below take priority)
all      = { level = "deny",  priority = -1 }
pedantic = { level = "warn",  priority = -1 }
nursery  = { level = "warn",  priority = -1 }

# Error handling — no silent failures, ever
unwrap_used      = "deny"
expect_used      = "deny"
unwrap_in_result = "deny"
panic            = "deny"
todo             = "deny"
unimplemented    = "deny"
unreachable      = "deny"
exit             = "deny"

# Observability — tracing only, never print macros
print_stdout = "deny"
print_stderr = "deny"
dbg_macro    = "deny"

# Suppression — #[allow] is forbidden; use #[expect(reason = "...")]
allow_attributes = "deny"

# Async discipline
await_holding_lock        = "deny"
await_holding_refcell_ref = "deny"

# Test discipline — return Err instead of panicking in Result-returning fns
panic_in_result_fn = "deny"

# Match exhaustiveness
wildcard_enum_match_arm = "deny"

# Arithmetic safety — no silent overflow, wrap, truncation, or sign loss
arithmetic_side_effects = "deny"
integer_division        = "deny"
modulo_arithmetic       = "deny"

# Numeric cast safety — all potentially lossy casts are hard errors
cast_possible_truncation = "deny"
cast_possible_wrap       = "deny"
cast_sign_loss           = "deny"
cast_precision_loss      = "deny"

# Index safety
indexing_slicing = "warn"

# Code quality
fallible_impl_from = "warn"
error_impl_error   = "warn"
format_push_string = "warn"
clone_on_ref_ptr   = "warn"

# API hygiene
exhaustive_structs = "warn"
exhaustive_enums   = "warn"
must_use_candidate = "warn"

# Pedantic false-positive overrides
module_name_repetitions = "allow"
redundant_pub_crate     = "allow"

# Doc-section requirements: project style (AGENTS.md) forbids boilerplate
# # Errors / # Panics sections; callers rely on signatures + typed errors.
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[lints.rustdoc]
broken_intra_doc_links   = "deny"
missing_crate_level_docs = "warn"

[profile.release]
opt-level     = 3
lto           = "thin"
codegen-units = 1
strip         = "symbols"

[profile.dev]
debug = true
