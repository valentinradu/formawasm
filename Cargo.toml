[package]
name         = "formawasm"
description  = "Backend that compiles a typed FormaLang IR module into a WebAssembly component."
version      = "0.0.1-beta"
edition      = "2024"
rust-version = "1.93"
authors      = ["Valentin Radu and formawasm contributors"]
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/valentinradu/formawasm"
homepage     = "https://wasm.formalang.org"
documentation = "https://docs.rs/formawasm"
readme       = "README.md"
keywords     = ["compiler", "webassembly", "wasm", "component-model", "wit"]
categories   = ["compilers", "wasm"]
# Whitelist what ships to crates.io. The mdBook source, marketing
# site, examples, agent / CI config, and design notes stay out of
# the registry tarball so consumers download only the source they
# need to build the library and CLI.
include = [
    "/src/**/*",
    "/Cargo.toml",
    "/README.md",
    "/LICENSE-MIT",
    "/LICENSE-APACHE",
    "/CHANGELOG.md",
]

# docs.rs builds with no features by default, which would hide the
# optional `wasm-opt` and `dwarf` rustdoc surfaces. Build with all
# features enabled and pass `--cfg docsrs` so feature-gated items
# render with the right "available on …" badges.
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
formalang = "0.0.3-beta"
thiserror = "2"

# Lightweight observability. `tracing` itself is a thin facade —
# only emits work when a subscriber is registered, so the default
# no-subscriber path is essentially free. Library code uses
# `#[instrument]` and `tracing::debug!` to mark pipeline stages;
# consumers that want to see the trace install a subscriber
# (e.g. `tracing-subscriber`) at startup.
tracing = "0.1"

# WebAssembly emission stack. wasm-encoder builds core module bytes;
# wit-component wraps a core module + WIT into a Component Model
# artifact; wit-parser is the WIT-text frontend `wit-component` builds
# its `Resolve` on; wasmparser is used by `WasmBackend::with_validation`
# to optionally re-validate the wrapped component bytes before
# returning. The crate is in the graph transitively via wit-component
# already, so promoting it to a direct dep is free in compile cost.
# wasm-tools crates share a coordinated version line.
wasm-encoder  = "0.247"
wasmparser    = "0.247"
wit-component = "0.247"
wit-parser    = "0.247"

# Optional binaryen-bindings dep — only pulled in when the `wasm-opt`
# feature is on. Builds binaryen from source at compile time, so
# omitting the feature keeps the dependency graph and compile cost
# unchanged for callers who don't need post-pass optimization.
# `tempfile` rides the same gate: wasm-opt only exposes a file-based
# API, so the post-pass shuttles bytes through a temp directory.
wasm-opt = { version = "0.116", optional = true }
tempfile = { version = "3", optional = true }

# Optional DWARF emission. Builds `.debug_*` custom sections from the
# IrSpan + file_table data upstream attaches to every IR node.
# Default-feature builds skip it entirely (no extra crate compile
# cost, no extra bytes in the emitted component).
gimli = { version = "0.32", default-features = false, features = ["std", "write"], optional = true }

[features]
# Off by default. When on, `WasmBackend::generate` runs the emitted
# core wasm bytes through binaryen's wasm-opt at `-Os` (size-leaning
# optimization) before wrapping the component. Validate
# `cabi_realloc` and the canonical-ABI param-split wrappers survive
# the pass — tests under the feature flag re-run every milestone
# end-to-end.
wasm-opt = ["dep:wasm-opt", "dep:tempfile"]

# Off by default. When on, `WasmBackend::generate` attaches DWARF
# `.debug_info` / `.debug_abbrev` / `.debug_line` / `.debug_str`
# custom sections to the emitted core module. Granularity is
# function-level: one subprogram DIE per user function with name +
# decl_file + decl_line + low_pc / high_pc, plus a `.debug_line`
# row pointing at each function's first source line. Per-statement
# line tables can layer on later.
dwarf = ["dep:gimli"]

[dev-dependencies]
# wasmtime hosts the component for end-to-end smoke tests.
# wasmparser is a direct runtime dep above (used by the optional
# validation builder), so it doesn't repeat here.
wasmtime = "44"

# Snapshot-style assertions for the WIT emitter — captures the full
# emitted text in `tests/snapshots/` so any divergence (whitespace,
# ordering, sibling lines) trips a review-gated diff.
insta = "1.43"

# ---------------------------------------------------------------------------
# Lint configuration. Strict by default; every override carries a comment
# explaining the reason. Enforced in CI.
# ---------------------------------------------------------------------------

[lints.rust]
unreachable_pub               = "deny"
unsafe_code                   = "forbid"
unused_must_use               = "deny"
missing_debug_implementations = "warn"
dead_code                     = "warn"

[lints.clippy]
# Lint groups (individual overrides below take priority)
all      = { level = "deny",  priority = -1 }
pedantic = { level = "warn",  priority = -1 }
nursery  = { level = "warn",  priority = -1 }

# Error handling — no silent failures, ever
unwrap_used      = "deny"
expect_used      = "deny"
unwrap_in_result = "deny"
panic            = "deny"
todo             = "deny"
unimplemented    = "deny"
unreachable      = "deny"
exit             = "deny"

# Observability — tracing only, never print macros
print_stdout = "deny"
print_stderr = "deny"
dbg_macro    = "deny"

# Suppression — #[allow] is forbidden; use #[expect(reason = "...")]
allow_attributes = "deny"

# Async discipline
await_holding_lock        = "deny"
await_holding_refcell_ref = "deny"

# Test discipline — return Err instead of panicking in Result-returning fns
panic_in_result_fn = "deny"

# Match exhaustiveness
wildcard_enum_match_arm = "deny"

# Arithmetic safety — no silent overflow, wrap, truncation, or sign loss
arithmetic_side_effects = "deny"
integer_division        = "deny"
modulo_arithmetic       = "deny"

# Numeric cast safety — all potentially lossy casts are hard errors
cast_possible_truncation = "deny"
cast_possible_wrap       = "deny"
cast_sign_loss           = "deny"
cast_precision_loss      = "deny"

# Index safety
indexing_slicing = "warn"

# Code quality
fallible_impl_from = "warn"
error_impl_error   = "warn"
format_push_string = "warn"
clone_on_ref_ptr   = "warn"

# API hygiene
exhaustive_structs = "warn"
exhaustive_enums   = "warn"
must_use_candidate = "warn"

# Pedantic false-positive overrides
module_name_repetitions = "allow"
redundant_pub_crate     = "allow"

# Doc-section requirements: project style (AGENTS.md) forbids boilerplate
# # Errors / # Panics sections; callers rely on signatures + typed errors.
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[lints.rustdoc]
broken_intra_doc_links   = "deny"
missing_crate_level_docs = "warn"

[profile.release]
opt-level     = 3
lto           = "thin"
codegen-units = 1
strip         = "symbols"

[profile.dev]
debug = true

# Slim the per-test-binary debug info. tests/ has ~70 integration test
# files and each one statically links wasmtime + cranelift + wasmparser;
# at full debuginfo each binary is ~80–120 MB and the combined output
# tree exhausts the GitHub Actions runner's free disk. line-tables-only
# keeps backtraces accurate but drops type info we don't need for tests.
[profile.test]
debug = "line-tables-only"
