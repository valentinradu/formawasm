name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# formawasm depends on formalang via path = "../formalang", so every
# job that resolves the dep graph needs both repos checked out as
# siblings under ${{ github.workspace }}. fmt is the only job that
# doesn't need formalang. defaults.run.working-directory points cargo
# at the formawasm checkout.
#
# Every cargo job that compiles also needs mold — .cargo/config.toml
# wires clang to use -fuse-ld=mold and the ubuntu-latest runner ships
# clang but not mold. Only fmt and deny skip the install (fmt doesn't
# touch object files; deny resolves metadata without compiling).
defaults:
  run:
    working-directory: formawasm

jobs:
  # ── Format ────────────────────────────────────────────────────────────────
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: formawasm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  # ── Clippy ────────────────────────────────────────────────────────────────
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        working-directory: /
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /usr/local/share/powershell /usr/local/share/chromium \
            /opt/hostedtoolcache/CodeQL /opt/microsoft /usr/share/swift
          sudo docker system prune -af || true
          df -h /
      - uses: actions/checkout@v4
        with:
          path: formawasm
      - uses: actions/checkout@v4
        with:
          repository: valentinradu/formalang
          path: formalang
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: build
          workspaces: formawasm
      - name: Install mold
        run: sudo apt-get update && sudo apt-get install -y mold
      - run: cargo clippy --all-targets -- -D warnings

  # ── Tests ─────────────────────────────────────────────────────────────────
  test:
    name: Test
    needs: clippy
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        working-directory: /
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /usr/local/share/powershell /usr/local/share/chromium \
            /opt/hostedtoolcache/CodeQL /opt/microsoft /usr/share/swift
          sudo docker system prune -af || true
          df -h /
      - uses: actions/checkout@v4
        with:
          path: formawasm
      - uses: actions/checkout@v4
        with:
          repository: valentinradu/formalang
          path: formalang
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: build
          workspaces: formawasm
      - name: Install mold
        run: sudo apt-get update && sudo apt-get install -y mold
      - run: cargo test

  # ── Doc ───────────────────────────────────────────────────────────────────
  doc:
    name: Doc
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        working-directory: /
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /usr/local/share/powershell /usr/local/share/chromium \
            /opt/hostedtoolcache/CodeQL /opt/microsoft /usr/share/swift
          sudo docker system prune -af || true
          df -h /
      - uses: actions/checkout@v4
        with:
          path: formawasm
      - uses: actions/checkout@v4
        with:
          repository: valentinradu/formalang
          path: formalang
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: build
          workspaces: formawasm
      - name: Install mold
        run: sudo apt-get update && sudo apt-get install -y mold
      - run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  # ── Dependency licenses + advisories ─────────────────────────────────────
  deny:
    name: Deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: formawasm
      - uses: actions/checkout@v4
        with:
          repository: valentinradu/formalang
          path: formalang
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo deny check

  # ── wasm-opt feature path ────────────────────────────────────────────────
  #
  # The optional `wasm-opt` feature pulls in `wasm-opt-sys`, which compiles
  # binaryen from source — adds a few minutes of build time per run, so
  # this lives in its own job rather than being layered onto the default
  # test step. Runs in parallel with the others; not a blocker for merge.
  # Without this job the feature path silently bit-rots since
  # `tests/wasm_opt_size.rs` is gated on it.
  wasm-opt:
    name: Test (--features wasm-opt)
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        working-directory: /
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /usr/local/share/powershell /usr/local/share/chromium \
            /opt/hostedtoolcache/CodeQL /opt/microsoft /usr/share/swift
          sudo docker system prune -af || true
          df -h /
      - uses: actions/checkout@v4
        with:
          path: formawasm
      - uses: actions/checkout@v4
        with:
          repository: valentinradu/formalang
          path: formalang
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: wasm-opt
          workspaces: formawasm
      - name: Install mold
        run: sudo apt-get update && sudo apt-get install -y mold
      - run: cargo test --features wasm-opt
