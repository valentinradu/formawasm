name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# formawasm depends on formalang via path = "../formalang", so every
# job that resolves the dep graph needs both repos checked out as
# siblings under ${{ github.workspace }}. fmt is the only job that
# doesn't need formalang. defaults.run.working-directory points cargo
# at the formawasm checkout.
defaults:
  run:
    working-directory: formawasm

jobs:
  # ── Format ────────────────────────────────────────────────────────────────
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: formawasm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  # ── Clippy ────────────────────────────────────────────────────────────────
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: formawasm
      - uses: actions/checkout@v4
        with:
          repository: valentinradu/formalang
          path: formalang
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: build
          workspaces: formawasm
      - run: cargo clippy --all-targets -- -D warnings

  # ── Tests ─────────────────────────────────────────────────────────────────
  test:
    name: Test
    needs: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: formawasm
      - uses: actions/checkout@v4
        with:
          repository: valentinradu/formalang
          path: formalang
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: build
          workspaces: formawasm
      # .cargo/config.toml asks clang+mold to link x86_64-linux. The
      # ubuntu-latest runner already ships clang but not mold.
      - name: Install mold
        run: sudo apt-get update && sudo apt-get install -y mold
      - run: cargo test

  # ── Doc ───────────────────────────────────────────────────────────────────
  doc:
    name: Doc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: formawasm
      - uses: actions/checkout@v4
        with:
          repository: valentinradu/formalang
          path: formalang
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: build
          workspaces: formawasm
      - run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  # ── Dependency licenses + advisories ─────────────────────────────────────
  deny:
    name: Deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: formawasm
      - uses: actions/checkout@v4
        with:
          repository: valentinradu/formalang
          path: formalang
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo deny check
